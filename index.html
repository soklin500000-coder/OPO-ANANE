    const short = raw.split('-')[0];
    if (SHINZY_I18N[short]) return short;
    return 'en';
  }
  const SHINZY_LANG = SHINZY_DETECT_LANG();
  const SHINZY_T = SHINZY_I18N[SHINZY_LANG];

  function SHINZY_APPLY_LANG() {
    const notice = document.getElementById('noticeBox');
    notice.innerHTML = `🔴 <strong>${SHINZY_T.noticeStrong}</strong><br>${SHINZY_T.noticeText}`;
    document.getElementById('vipBtn').textContent = SHINZY_T.vipBtn;
    document.getElementById('chatBtn').textContent = SHINZY_T.chatBtn;
    const shareEl = document.getElementById('shareLabel');
    if (shareEl) shareEl.textContent = SHINZY_T.share;
    const inp = document.getElementById('commentInput');
    if (inp) inp.placeholder = SHINZY_T.placeholder;
    const btn = document.querySelector('#commentForm button');
    if (btn) btn.textContent = SHINZY_T.send;
    document.documentElement.lang = SHINZY_LANG;
  }
  SHINZY_APPLY_LANG();

  /* ===== AVATAR / USERNAME / VIDEO RANDOM ===== */
  const SHINZY_AVATAR_PHOTOS = ['img/pp1.jpg','img/pp2.jpg','img/pp3.jpg','img/pp4.jpg'];
  document.getElementById('avatarImg').src = SHINZY_AVATAR_PHOTOS[Math.floor(Math.random() * SHINZY_AVATAR_PHOTOS.length)];

  const SHINZY_USERNAMES = ['lena_mueller','sophie_k','annika_berlin','mia_wagner','clara_hh','nina_schmidt','lea_hoffmann','emma_koch','julia_b','marie_berlin','hanna_w','laura_muc','felixia_k','sarah_ffm','lisa_dd','kim_berlin','vanessa_k','nina_b','mia_hh','emily_ger','johanna_m','sina_w','alina_k','celina_b','lara_hh','paula_m','antonia_w','greta_berlin'];
  document.getElementById('username').textContent = '@' + SHINZY_USERNAMES[Math.floor(Math.random() * SHINZY_USERNAMES.length)];

  const SHINZY_VIDEOS = ['video/video1.mp4','video/video2.mp4','video/video3.mp4'];
  const SHINZY_BG_VIDEO = document.getElementById('bgVideo');
  SHINZY_BG_VIDEO.src = SHINZY_VIDEOS[Math.floor(Math.random() * SHINZY_VIDEOS.length)];
  const SHINZY_PLAY_PROMISE = SHINZY_BG_VIDEO.play();
  if (SHINZY_PLAY_PROMISE !== undefined) {
    SHINZY_PLAY_PROMISE.catch(() => {
      SHINZY_BG_VIDEO.style.display = 'none';
      document.body.style.background = 'url(https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=1080) center/cover no-repeat';
    });
  }

  /* ===== LIKE ===== */
  let SHINZY_LIKES = 24500;
  const SHINZY_LIKE_BTN = document.getElementById('likeBtn');
  const SHINZY_LIKE_COUNT = document.getElementById('likeCount');
  SHINZY_LIKE_BTN.addEventListener('click', () => {
    SHINZY_LIKES++;
    SHINZY_LIKE_COUNT.textContent = SHINZY_LIKES > 1000 ? (SHINZY_LIKES / 1000).toFixed(1) + 'K' : SHINZY_LIKES;
    const SHINZY_HEART = document.createElement('div');
    SHINZY_HEART.textContent = '❤️';
    SHINZY_HEART.style.cssText = 'position:fixed;right:30px;bottom:230px;font-size:24px;pointer-events:none;animation:fly 1s forwards;z-index:99';
    document.body.appendChild(SHINZY_HEART);
    setTimeout(() => SHINZY_HEART.remove(), 1000);
  });

  /* ===== CLOSE → CPA ===== */
  document.querySelector('.close-btn').addEventListener('click', () => {
    window.location.href = SHINZY_CONFIG.CPA_LINK;
  });

  /* ===== COMMENT SUBMIT → COMMENT_LINK ===== */
  document.getElementById('commentForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('commentInput').value.trim();
    if (!val) return;
    const SHINZY_EL = document.createElement('div');
    SHINZY_EL.className = 'comment';
    SHINZY_EL.innerHTML = `<div class="cavatar">😎</div>
                    <div><span class="cname">you</span>${val.replace(/</g,'&lt;')}</div>`;
    document.getElementById('comments').appendChild(SHINZY_EL);
    window.location.href = SHINZY_CONFIG.COMMENT_LINK;
  });

  /* ===== RANDOM COMMENTS ===== */
  const SHINZY_COMMENTS_BOX = document.getElementById('comments');
  const SHINZY_NAMES = ['lukas_m','jonas_berlin','felix_k','maximilian_w','leon_hh','paul_muc','benjamin_k','nicolas_b','david_hh','tobias_m','sebastian_w','philipp_k','matthias_b','daniel_hh','andreas_m','florian_w','thomas_k','marcel_b','kevin_hh','dennis_m','alexander_w','patrick_k','fabian_b','simon_hh','julian_m','marvin_w','timo_k','niklas_b','moritz_hh','dominik_m'];
  const SHINZY_AVATARS = ['🔥','💜','😎','✨','🎯','💎','😍','👀','💥','🌟','🖤','⚡','🎥','💫'];
  const SHINZY_PICK = arr => arr[Math.floor(Math.random() * arr.length)];

  function SHINZYComment() {
    const SHINZY_EL = document.createElement('div');
    SHINZY_EL.className = 'comment';
    SHINZY_EL.innerHTML = `<div class="cavatar">${SHINZY_PICK(SHINZY_AVATARS)}</div>
                    <div><span class="cname">${SHINZY_PICK(SHINZY_NAMES)}</span>${SHINZY_PICK(SHINZY_T.comments)}</div>`;
    SHINZY_COMMENTS_BOX.appendChild(SHINZY_EL);
    if (SHINZY_COMMENTS_BOX.children.length > 5) SHINZY_COMMENTS_BOX.removeChild(SHINZY_COMMENTS_BOX.firstChild);
    setTimeout(SHINZYComment, 1600 + Math.random() * 1800);
  }

  function SHINZYJoinNotif() {
    const SHINZY_EL = document.createElement('div');
    SHINZY_EL.className = 'comment';
    SHINZY_EL.style.background = 'rgba(180,0,255,0.25)';
    SHINZY_EL.innerHTML = `<div class="cavatar">✓</div>
                    <div><span class="cname">${SHINZY_PICK(SHINZY_NAMES)}</span>${SHINZY_T.joinedVip}</div>`;
    SHINZY_COMMENTS_BOX.appendChild(SHINZY_EL);
    if (SHINZY_COMMENTS_BOX.children.length > 5) SHINZY_COMMENTS_BOX.removeChild(SHINZY_COMMENTS_BOX.firstChild);
  }

  setInterval(SHINZYJoinNotif, 6500);
  setTimeout(SHINZYComment, 900);
</script>

</body>
</html>
